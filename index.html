<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JLPT Practice</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%238b5fd1'/><text x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='sans-serif'>試</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>
  <script>
    // Load fresh copies so edits to the data show up without a hard refresh.
    // Question text files are generated by tools/build_questions.py.
    const v = Date.now();
    const files = [
      "data/exams.js",
      "data/question-types.js",
      "data/questions.js",
      "app.js",
    ];
    document.write(files.map((f) => `<script src="${f}?v=${v}"><\/script>`).join(""));
  </script>
</body>
</html>
